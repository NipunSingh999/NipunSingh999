<svg viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="avatarClip">
      <circle cx="130" cy="130" r="95"/>
    </clipPath>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#00E0C6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="820" height="260" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="818" height="258" rx="17" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- avatar photo -->
  <image href="https://github.com/NipunSingh999.png" x="35" y="35" width="190" height="190" clip-path="url(#avatarClip)"/>

  <!-- pulsing ring around avatar -->
  <circle cx="130" cy="130" r="97" fill="none" stroke="#58A6FF" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="97;108;97" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- corner scan brackets -->
  <g stroke="#58A6FF" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M20 55 V35 H40"/>
    <path d="M220 35 H240 V55"/>
    <path d="M240 205 V225 H220"/>
    <path d="M40 225 H20 V205"/>
  </g>

  <!-- moving scan beam across the photo -->
  <rect x="35" y="35" width="190" height="10" fill="url(#beamGrad)">
    <animate attributeName="y" values="35;215;35" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- clip the beam to the circle so it doesn't spill outside the photo -->
  <clipPath id="beamClip"><circle cx="130" cy="130" r="95"/></clipPath>

  <!-- info panel -->
  <g font-family="Consolas, 'Fira Code', monospace" fill="#c9d1d9">
    <text x="260" y="72" font-size="24" font-weight="700" fill="#f0f6fc" opacity="0">
      Nipun Singh
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.15;1" dur="2.4s" begin="0.1s" fill="freeze"/>
    </text>

    <text x="260" y="102" font-size="15" fill="#8b949e" opacity="0">
      Final Year B.Tech CSE Student
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.15;1" dur="2.4s" begin="0.5s" fill="freeze"/>
    </text>

    <text x="260" y="128" font-size="15" fill="#8b949e" opacity="0">
      Android Developer • ML Engineer
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.15;1" dur="2.4s" begin="0.9s" fill="freeze"/>
    </text>

    <text x="260" y="154" font-size="15" fill="#8b949e" opacity="0">
      Building: SpendBite • AI Price Comparison (SDG 12)
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.15;1" dur="2.4s" begin="1.3s" fill="freeze"/>
    </text>

    <!-- scan progress bar -->
    <rect x="260" y="182" width="480" height="8" rx="4" fill="#21262d"/>
    <rect x="260" y="182" width="0" height="8" rx="4" fill="url(#barGrad)">
      <animate attributeName="width" values="0;480;480" keyTimes="0;0.7;1" dur="2.6s" begin="0.2s" fill="freeze"/>
    </rect>

    <text x="260" y="212" font-size="14" fill="#00E0C6" opacity="0">
      ✓ Scan complete — open to Android / ML internships
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.15;1" dur="1.5s" begin="2s" fill="freeze"/>
    </text>
  </g>
</svg>
